[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -m "not eval" --ignore=tests/eval/cases
pythonpath = .
markers =
    db: requires a reachable Postgres (DATABASE_URL)
    docker: requires a Docker daemon and the cve-sandbox-python image
    redis: requires a reachable Redis (REDIS_URL)
    celery: starts a real Celery worker process (needs Redis, Postgres)
    s3: requires the local S3 (MinIO)
    syft: requires the syft binary (SYFT_BIN)
    eval: golden-CVE evaluation (real Docker + PyPI; run with: pytest -m eval tests/eval)
    contract_live: hits the real external services (opt-in: CONTRACT_LIVE=1)
