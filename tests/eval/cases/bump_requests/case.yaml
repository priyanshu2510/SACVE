name: bump_requests
description: Simple version bump of a directly pinned dependency (CVE-2024-35195, requests 2.31.0 -> 2.32.0).
cve: {cve_id: CVE-2024-35195, cvss: 5.6, severity: MEDIUM, ecosystem: pip, package: requests,
      affected_versions: ["< 2.32.0"], fixed_version: "2.32.0",
      description: "requests Session objects that make a first request with verify=False keep ignoring certificate verification for later requests to the same host."}
job: {installed_version: "2.31.0", target_version: "2.32.0", manifest_file_path: requirements.txt}
expect:
  terminal_status: PR_RAISED
  files_changed: [requirements.txt]
  max_diff_lines: 2
  min_confidence: 85
  max_attempts: 1
  scanner_resolved: true
